<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dating Profile</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #fd5068;
      --accent-grad: linear-gradient(45deg, #ff6036, #fd5068);
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --border: #2a2e3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px;
    }
    #lock-screen {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #lock-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lock-screen p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
    
    .input-box { display: flex; flex-direction: column; gap: 12px; }
    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    input#passInput {
      width: 100%;
      padding: 12px 42px 12px 16px;
      background: #13151c;
      border: 1px solid #363b4e;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    input#passInput:focus { border-color: var(--accent); }
    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .eye-btn svg { width: 20px; height: 20px; fill: currentColor; }

    button.unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-grad);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    #app { display: none; width: 100%; max-width: 440px; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH KHÓA -->
  <div id="lock-screen">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <h2>Trang cá nhân giới hạn</h2>
    <p>Nhập Passcode để mở khóa toàn bộ hồ sơ.</p>
    <div class="input-box">
      <div class="password-wrapper">
        <input type="password" id="passInput" placeholder="Nhập Passcode..." autofocus onkeydown="if(event.key==='Enter') unlockSite()">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility()">
          <svg id="eye-icon-open" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <svg id="eye-icon-closed" style="display: none;" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>
        </button>
      </div>
      <button class="unlock-btn" onclick="unlockSite()">Mở khóa hồ sơ</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <main id="app"></main>

  <script>
    let failedAttempts = 0;

    function togglePasswordVisibility() {
      const passInput = document.getElementById("passInput");
      const iconOpen = document.getElementById("eye-icon-open");
      const iconClosed = document.getElementById("eye-icon-closed");
      if (passInput.type === "password") {
        passInput.type = "text";
        iconOpen.style.display = "none";
        iconClosed.style.display = "block";
      } else {
        passInput.type = "password";
        iconOpen.style.display = "block";
        iconClosed.style.display = "none";
      }
    }

    const RAW_HTML = `
      <style>
        .profile-container {
          background: #1a1d26;
          border-radius: 20px;
          border: 1px solid #2a2e3d;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .cover-photo { width: 100%; height: 380px; position: relative; background: #252836; }
        .cover-photo img { width: 100%; height: 100%; object-fit: cover; }
        .photo-tag {
          position: absolute;
          bottom: 16px;
          left: 16px;
          background: rgba(15, 17, 23, 0.75);
          backdrop-filter: blur(8px);
          padding: 6px 14px;
          border-radius: 12px;
          font-weight: 700;
          font-size: 1.25rem;
          border: 1px solid rgba(255,255,255,0.1);
        }
        .content-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .section-box {
          background: #13151c;
          border: 1px solid #282c3c;
          border-radius: 14px;
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .section-title { font-size: 0.95rem; font-weight: 700; color: #ff7b90; display: flex; align-items: center; gap: 6px; }
        .section-desc { font-size: 0.88rem; color: #d0d4dc; line-height: 1.45; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .tag-item {
          background: #262a38;
          border: 1px solid #363b4e;
          padding: 4px 10px;
          border-radius: 8px;
          font-size: 0.78rem;
          color: #e2e8f0;
        }
        .check-item {
          display: flex;
          align-items: center;
          gap: 10px;
          background: #1b1e2a;
          padding: 10px 12px;
          border-radius: 10px;
          cursor: pointer;
          user-select: none;
          border: 1px solid #282d3f;
        }
        .check-item input[type="checkbox"] { accent-color: #fd5068; width: 17px; height: 17px; }
        .check-item label { font-size: 0.85rem; color: #cbd5e1; cursor: pointer; flex: 1; }
        
        .quiz-launcher-btn {
          width: 100%;
          padding: 14px;
          border: none;
          border-radius: 12px;
          background: linear-gradient(45deg, #6c5ce7, #a29bfe);
          color: #fff;
          font-size: 0.95rem;
          font-weight: 700;
          cursor: pointer;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 8px;
          box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        /* POPUP MODAL QUIZ */
        .modal-overlay {
          display: none;
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: rgba(0,0,0,0.85);
          backdrop-filter: blur(6px);
          z-index: 999;
          justify-content: center;
          align-items: center;
          padding: 16px;
        }
        .quiz-card {
          background: #1a1d26;
          border: 1px solid #363b4e;
          border-radius: 18px;
          max-width: 400px;
          width: 100%;
          padding: 22px;
          display: flex;
          flex-direction: column;
          gap: 16px;
          position: relative;
        }
        .quiz-header { display: flex; justify-content: space-between; align-items: center; }
        .quiz-progress { font-size: 0.85rem; color: #a29bfe; font-weight: 600; }
        .quiz-close { background: none; border: none; color: #9aa0a6; font-size: 1.3rem; cursor: pointer; }
        .quiz-question { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-opt-btn {
          background: #13151c;
          border: 1px solid #2e3346;
          border-radius: 10px;
          padding: 12px 14px;
          text-align: left;
          color: #e2e8f0;
          font-size: 0.9rem;
          cursor: pointer;
          transition: all 0.2s;
        }
        .quiz-opt-btn:hover { border-color: #a29bfe; background: #212536; }
        .quiz-result-view { text-align: center; display: none; flex-direction: column; gap: 12px; }
      </style>

      <div class="profile-container">
        <div class="cover-photo">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80" alt="Avatar">
          <div class="photo-tag">Gia Triết, 21 ✨</div>
        </div>

        <div class="content-body">
          <!-- NÚT MỞ TRẮC NGHIỆM -->
          <button class="quiz-launcher-btn" onclick="openQuizModal()">
            🎮 Chơi Mini-Game: 10 Câu Hiểu Nhau
          </button>

          <!-- TỔNG QUAN -->
          <div class="section-box">
            <div class="section-title">👤 Giới thiệu chung</div>
            <div class="section-desc">Kỷ luật, thích sự chân thực, yêu chiều sâu của kiến trúc, tư duy pháp lý và những bản nhạc tĩnh lặng.</div>
            <div class="tag-list">
              <span class="tag-item">📍 Sài Gòn</span>
              <span class="tag-item">☕ Cà phê đen</span>
              <span class="tag-item">🎶 Trữ tình & Indie</span>
            </div>
            <div class="check-item">
              <input type="checkbox" id="c1"><label for="c1">Thích người sống kỷ luật, tư duy rõ ràng và biết quan tâm</label>
            </div>
          </div>

          <!-- GÓC RIÊNG TƯ -->
          <div class="section-box" style="border-left: 4px solid #fd5068;">
            <div class="section-title">🔒 Góc riêng tư / Thân mật & XHTD</div>
            <div class="section-desc">Đề cao sự tin cậy, tôn trọng ranh giới và chỉ bước vào thân mật khi đã thấu hiểu cảm xúc của nhau.</div>
            <div class="check-item">
              <input type="checkbox" id="c2"><label for="c2">Đồng điệu: Cảm xúc gắn bó là nền tảng của mọi sự thân mật</label>
            </div>
          </div>
        </div>
      </div>

      <!-- POP-UP MODAL TRẮC NGHIỆM -->
      <div id="quizModal" class="modal-overlay">
        <div class="quiz-card">
          <div class="quiz-header">
            <span id="qProgress" class="quiz-progress">Câu 1/10</span>
            <button class="quiz-close" onclick="closeQuizModal()">&times;</button>
          </div>

          <!-- Khung câu hỏi -->
          <div id="qArea">
            <div id="qTitle" class="quiz-question"></div>
            <div id="qOptions" class="quiz-options" style="margin-top: 14px;"></div>
          </div>

          <!-- Màn hình kết quả sau khi trả lời xong 10 câu -->
          <div id="qResultArea" class="quiz-result-view">
            <div style="font-size: 2.2rem;">🎯</div>
            <h3 style="font-size: 1.2rem;">Chỉ số ăn ý trắc nghiệm</h3>
            <div id="qFinalScore" style="font-size: 2rem; font-weight: 800; color: #38ef7d;">0/10 Điểm</div>
            <p id="qFinalMsg" style="font-size: 0.88rem; color: #94a3b8; line-height: 1.4;"></p>
            <button class="quiz-launcher-btn" style="margin-top: 10px;" onclick="closeQuizModal()">Quay lại hồ sơ</button>
          </div>
        </div>
      </div>
    `;

    function unlockSite() {
      const pass = document.getElementById("passInput").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const lockScreen = document.getElementById("lock-screen");
      const app = document.getElementById("app");

      if (pass === "noinaycotui") {
        lockScreen.style.display = "none";
        app.innerHTML = RAW_HTML;
        app.style.display = "block";
        errorMsg.style.display = "none";
      } else {
        failedAttempts++;
        errorMsg.innerText = `Bạn đã nhập sai lần thứ ${failedAttempts}!`;
        errorMsg.style.display = "block";
        errorMsg.style.animation = 'none';
        errorMsg.offsetHeight;
        errorMsg.style.animation = 'shake 0.3s ease-in-out';
      }
    }

    // DỮ LIỆU 10 CÂU HỎI TRẮC NGHIỆM (indexMatch: phương án hợp gu nhất)
    const QUIZ_DATA = [
      {
        q: "1. Một buổi hẹn hò lý tưởng vào cuối tuần của bạn là?",
        opts: [
          "Quán cà phê acoustic/yên tĩnh, ngồi nói chuyện sâu",
          "Đi quẩy club, bar nhạc sôi động, tụ tập đông người",
          "Cùng nhau đi dạo phố, ngắm kiến trúc đêm rồi ăn vặt"
        ],
        matchIdx: [0, 2]
      },
      {
        q: "2. Khi có mâu thuẫn hay hiểu lầm, bạn sẽ xử lý thế nào?",
        opts: [
          "Im lặng vài ngày để tự nguôi ngoai",
          "Nói chuyện thẳng thắn, rõ ràng và giải quyết ngay",
          "Bóng gió trên mạng xã hội cho đối phương tự hiểu"
        ],
        matchIdx: [1]
      },
      {
        q: "3. Quan điểm của bạn về không gian riêng tư khi quen nhau?",
        opts: [
          "Phải kiểm tra mật khẩu, tin nhắn của nhau 24/7",
          "Tôn trọng công việc, thời gian riêng và mục tiêu cá nhân",
          "Chỉ cần đi đâu nhớ báo là được"
        ],
        matchIdx: [1, 2]
      },
      {
        q: "4. Thói quen rèn luyện thể chất & giữ dáng với bạn thế nào?",
        opts: [
          "Rất quan trọng, thích tập gym/thể thao để giữ cơ thể săn chắc",
          "Bình thường, lâu lâu hứng lên mới vận động",
          "Thích nằm nhà lướt điện thoại hơn là vận động"
        ],
        matchIdx: [0]
      },
      {
        q: "5. Gu âm nhạc thường ngày bạn hay bật nhất?",
        opts: [
          "Indie, Ballad, Acoustic hoặc nhạc có chiều sâu ca từ",
          "EDM, Vinahouse cực mạnh",
          "Nhạc trending TikTok, nghe vui tai là được"
        ],
        matchIdx: [0]
      },
      {
        q: "6. Khi nhắn tin làm quen, điều gì khiến bạn thấy dễ chịu nhất?",
        opts: [
          "Rep tin nhắn tử tế, có câu chuyện để trao đổi",
          "Spam icon liên tục, nhắn cụt ngủn 'uh', 'ok'",
          "Thích gọi điện thoại trò chuyện trực tiếp hơn"
        ],
        matchIdx: [0, 2]
      },
      {
        q: "7. Bạn nghĩ gì về sự kỷ luật bản thân trong công việc/học tập?",
        opts: [
          "Tới đâu hay tới đó, không cần kế hoạch",
          "Kỷ luật là tự do, tôn trọng thời gian và lời hứa",
          "Hay trì hoãn nhưng nước đến chân mới nhảy"
        ],
        matchIdx: [1]
      },
      {
        q: "8. Khi bước vào một mối quan hệ, điều bạn tìm kiếm là?",
        opts: [
          "Mập mờ cho vui, không ràng buộc",
          "Một sự đồng hành lâu dài, chân thành và tôn trọng nhau",
          "Chỉ cần đẹp trai/xinh gái là được"
        ],
        matchIdx: [1]
      },
      {
        q: "9. Về sự thân mật & gần gũi trong tình cảm (XHTD):",
        opts: [
          "Cần gắn kết cảm xúc, thấu hiểu và tin cậy nhau trước",
          "Gặp nhau thấy thích là có thể thân mật ngay",
          "Ngại ngùng, không bao giờ dám nói về chuyện này"
        ],
        matchIdx: [0]
      },
      {
        q: "10. Sau khi hoàn thành trắc nghiệm này, bạn có muốn một buổi cà phê?",
        opts: [
          "Có chứ, một buổi trò chuyện trực tiếp sẽ rõ ràng hơn!",
          "Để xem điểm số trắc nghiệm đã rồi tính",
          "Chắc chỉ xem cho vui thôi"
        ],
        matchIdx: [0, 1]
      }
    ];

    let currentQ = 0;
    let quizScore = 0;

    function openQuizModal() {
      currentQ = 0;
      quizScore = 0;
      document.getElementById("qResultArea").style.display = "none";
      document.getElementById("qArea").style.display = "block";
      document.getElementById("quizModal").style.display = "flex";
      renderQuestion();
    }

    function closeQuizModal() {
      document.getElementById("quizModal").style.display = "none";
    }

    function renderQuestion() {
      const qData = QUIZ_DATA[currentQ];
      document.getElementById("qProgress").innerText = `Câu ${currentQ + 1}/10`;
      document.getElementById("qTitle").innerText = qData.q;
      
      const optContainer = document.getElementById("qOptions");
      optContainer.innerHTML = "";
      
      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optContainer.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx) {
      if (QUIZ_DATA[currentQ].matchIdx.includes(chosenIdx)) {
        quizScore++;
      }
      currentQ++;
      if (currentQ < QUIZ_DATA.length) {
        renderQuestion();
      } else {
        showQuizResult();
      }
    }

    function showQuizResult() {
      document.getElementById("qArea").style.display = "none";
      const resArea = document.getElementById("qResultArea");
      const finalScore = document.getElementById("qFinalScore");
      const finalMsg = document.getElementById("qFinalMsg");

      finalScore.innerText = `${quizScore}/10 Câu Trùng Khớp`;
      if (quizScore >= 8) {
        finalMsg.innerText = "Tần số suy nghĩ và gu sống ăn khớp đến hơn 80%! Cực kỳ hợp nhau ở những nguyên tắc sống quan trọng nhất.";
      } else if (quizScore >= 5) {
        finalMsg.innerText = "Đạt mức tương thích khá tốt. Có nhiều quan điểm chung, những phần khác biệt chính là chủ đề hay để trò chuyện.";
      } else {
        finalMsg.innerText = "Gu sống và cách nhìn nhận khá khác nhau, nhưng sự đối lập đôi khi lại tạo nên những góc nhìn rất thú vị.";
      }
      resArea.style.display = "flex";
    }
  </script>
</body>
</html>
