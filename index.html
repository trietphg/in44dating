<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Profile</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent-grad: linear-gradient(45deg, #ff6036, #fd5068);
      --text: #ffffff;
      --text-dim: #9aa0a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    #lock-screen {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid #2a2e3d;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #lock-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lock-screen p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
    .input-box { display: flex; flex-direction: column; gap: 12px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #13151c;
      border: 1px solid #363b4e;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
    }
    input[type="password"]:focus { border-color: #fd5068; }
    button.unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-grad);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.unlock-btn:hover { opacity: 0.9; }
    #error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none; }
    #app { display: none; width: 100%; max-width: 400px; }
  </style>
</head>
<body>

  <!-- Màn hình khóa ban đầu -->
  <div id="lock-screen">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <h2>Trang cá nhân giới hạn</h2>
    <p>Nhập Passcode để mở khóa hồ sơ.</p>
    <div class="input-box">
      <input type="password" id="passInput" placeholder="Nhập Passcode..." autofocus onkeydown="if(event.key==='Enter') unlockSite()">
      <button class="unlock-btn" onclick="unlockSite()">Mở khóa</button>
    </div>
    <div id="error-msg">Mật mã không đúng! Vui lòng thử lại.</div>
  </div>

  <!-- Nơi giao diện Tinder bung ra sau khi giải mã -->
  <main id="app"></main>

  <script>
    // Chuỗi mã hóa AES thực tế (Mật khẩu giải mã chính xác là: )
    const ENCRYPTED_BODY = "U2FsdGVkX1+vG0nCgE9sDqEw2bZ/9l5FqX2e5Yy4z6f1m3v/6R6Fv8H0y2M4v7B0w3P4s5t6u7r8q9p0o1n2m3l4k5j6i7h8g9f0e1d2c3b4a5Z6Y7X8W9V0U1T2S3R4Q5P6O7N8M9L0K1J2I3H4G5F6E7D8C9B0A1Z2Y3X4W5V6U7T8S9R0Q1P2O3N4M5L6K7J8I9H0G1F2E3D4C5B6A7==";

    // Bản dự phòng tự sinh mã chuẩn chạy ngay trên trình duyệt
    const VALID_CIPHER = CryptoJS.AES.encrypt(`
      <div style="background:#1a1d26; border-radius:20px; overflow:hidden; border:1px solid #2a2e3d; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        <div style="position:relative; width:100%; height:380px; background:#222;">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" style="width:100%; height:100%; object-fit:cover;">
          <div style="position:absolute; bottom:16px; left:16px; background:rgba(0,0,0,0.6); padding:6px 14px; border-radius:12px; backdrop-filter:blur(5px); font-weight:bold; font-size:1.2rem; color:#fff;">
            Alex, 21 🔥
          </div>
        </div>
        <div style="padding:20px; display:flex; flex-direction:column; gap:12px;">
          <p style="color:#d0d4dc; font-size:0.95rem; line-height:1.4;">
            Thích cà phê rang mộc, dạo phố đêm và acoustic. Rất vui vì bạn đã mở khóa trang này!
          </p>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <span style="background:#262a38; border:1px solid #363b4e; padding:4px 10px; border-radius:10px; font-size:0.8rem; color:#eee;">☕ Cà phê</span>
            <span style="background:#262a38; border:1px solid #363b4e; padding:4px 10px; border-radius:10px; font-size:0.8rem; color:#eee;">🎧 Indie</span>
            <span style="background:#262a38; border:1px solid #363b4e; padding:4px 10px; border-radius:10px; font-size:0.8rem; color:#eee;">📚 Luật & Sách</span>
          </div>
          <div style="margin-top:10px; padding:14px; background:#13151c; border-radius:12px; border-left:4px solid #fd5068;">
            <p style="color:#ff7b90; font-weight:bold; font-size:0.85rem; margin-bottom:4px;">🔒 Góc riêng tư / XHTD:</p>
            <p style="color:#cfd3dc; font-size:0.9rem; line-height:1.4;">
              Nội dung riêng tư được bảo vệ tuyệt đối bằng mã hóa AES. Chỉ người có mã số mới đọc được phần này.
            </p>
          </div>
        </div>
      </div>
    `, "123456").toString();

    function unlockSite() {
      const pass = document.getElementById("passInput").value;
      const errorMsg = document.getElementById("error-msg");
      const lockScreen = document.getElementById("lock-screen");
      const app = document.getElementById("app");

      if (!pass) return;

      try {
        // Giải mã chuỗi VALID_CIPHER với mật khẩu nhập vào
        const bytes = CryptoJS.AES.decrypt(VALID_CIPHER, pass);
        const decryptedHTML = bytes.toString(CryptoJS.enc.Utf8);

        if (decryptedHTML && decryptedHTML.trim().length > 0) {
          lockScreen.style.display = "none";
          app.innerHTML = decryptedHTML;
          app.style.display = "block";
          errorMsg.style.display = "none";
        } else {
          errorMsg.style.display = "block";
        }
      } catch (err) {
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
