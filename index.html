<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dating Profile</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #fd5068;
      --accent-grad: linear-gradient(45deg, #ff6036, #fd5068);
      --quiz-grad: linear-gradient(45deg, #6c5ce7, #a29bfe);
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --border: #2a2e3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    #lock-screen {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #lock-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lock-screen p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
    
    .input-box { display: flex; flex-direction: column; gap: 12px; }
    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    input#passInput {
      width: 100%;
      padding: 12px 42px 12px 16px;
      background: #13151c;
      border: 1px solid #363b4e;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input#passInput:focus { border-color: var(--accent); }
    
    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .eye-btn:hover { color: #fff; }
    .eye-btn svg { width: 20px; height: 20px; fill: currentColor; }

    button.unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-grad);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.unlock-btn:hover { opacity: 0.9; }

    #error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    #app { display: none; width: 100%; max-width: 920px; margin: auto; }
    .profile-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 850px) {
      .profile-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        align-items: start;
      }
      .left-column {
        position: sticky;
        top: 24px;
      }
      .right-column {
        max-height: 92vh;
        overflow-y: auto;
        padding-right: 8px;
      }
      .right-column::-webkit-scrollbar { width: 6px; }
      .right-column::-webkit-scrollbar-track { background: #13151c; border-radius: 4px; }
      .right-column::-webkit-scrollbar-thumb { background: #363b4e; border-radius: 4px; }
      .right-column::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    }

    .identity-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cover-photo { width: 100%; height: 320px; position: relative; background: #252836; }
    .cover-photo img { width: 100%; height: 100%; object-fit: cover; }
    .identity-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    
    .id-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      border-bottom: 1px dashed #282c3c;
      padding-bottom: 8px;
    }
    .id-row:last-child { border-bottom: none; padding-bottom: 0; }
    .id-label { color: var(--text-dim); }
    .id-val { font-weight: 600; color: #f1f5f9; text-align: right; }

    .right-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .section-title { font-size: 0.95rem; font-weight: 700; color: #ff7b90; display: flex; align-items: center; gap: 6px; }
    .section-desc { font-size: 0.88rem; color: #d0d4dc; line-height: 1.5; }
    
    /* TAGS CÓ THỂ TICK CHỌN TRỰC TIẾP */
    .tag-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .tag-check {
      background: #202433;
      border: 1px solid #363b4e;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .tag-check:hover {
      border-color: var(--accent);
      color: #fff;
    }
    .tag-check.active {
      background: rgba(253, 80, 104, 0.18);
      border-color: var(--accent);
      color: #ff94a4;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(253, 80, 104, 0.25);
    }
    .tag-check input[type="checkbox"] {
      pointer-events: none; /* Khóa sự kiện riêng của ô input để nhận sự kiện click của cả thẻ label */
      accent-color: var(--accent);
      width: 17px;
      height: 17px;
    }

    /* KHUNG BIỂU ĐỒ TRỌNG SỐ ĐỒNG ĐIỆU */
    .chart-container {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #2f455d;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chart-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #a29bfe;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bar-item { display: flex; flex-direction: column; gap: 4px; }
    .bar-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: #cbd5e1; }
    .bar-track {
      width: 100%;
      height: 10px;
      background: #111822;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #233446;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 6px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .quiz-launcher-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--quiz-grad);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid #363b4e;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; }
    .quiz-progress { font-size: 0.85rem; color: #a29bfe; font-weight: 600; }
    .quiz-close { background: none; border: none; color: #9aa0a6; font-size: 1.3rem; cursor: pointer; }
    .quiz-question { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-opt-btn {
      background: #13151c;
      border: 1px solid #2e3346;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      color: #e2e8f0;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-opt-btn:hover { border-color: #a29bfe; background: #212536; }
    .quiz-result-view { text-align: center; display: none; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <h2>Trang cá nhân giới hạn</h2>
    <p>Nhập Passcode để mở khóa toàn bộ hồ sơ.</p>
    
    <div class="input-box">
      <div class="password-wrapper">
        <input type="password" id="passInput" placeholder="Nhập Passcode..." autofocus onkeydown="if(event.key==='Enter') unlockSite()">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" aria-label="Hiện/Ẩn mật mã">
          <svg id="eye-icon-open" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <svg id="eye-icon-closed" style="display: none;" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>
        </button>
      </div>
      <button class="unlock-btn" onclick="unlockSite()">Mở khóa hồ sơ</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <main id="app"></main>

  <script>
    let failedAttempts = 0;

    function togglePasswordVisibility() {
      const passInput = document.getElementById("passInput");
      const iconOpen = document.getElementById("eye-icon-open");
      const iconClosed = document.getElementById("eye-icon-closed");
      if (passInput.type === "password") {
        passInput.type = "text";
        iconOpen.style.display = "none";
        iconClosed.style.display = "block";
      } else {
        passInput.type = "password";
        iconOpen.style.display = "block";
        iconClosed.style.display = "none";
      }
    }

    const RAW_HTML = `

          <!-- NHÓM 1: GU & THẨM MỸ (CATEGORY: aesthetic) -->

            <div class="section-title">🎨 Gu thẩm mỹ & Sở thích riêng</div>
            <div class="section-desc">Những điều mang lại cảm hứng sáng tạo và sự thư thái:</div>
            
            <div class="tag-list">
              <label class="tag-check" data-cat="aesthetic" onclick="handleTagClick(this)">

              <label class="tag-check" data-cat="intimacy" onclick="handleTagClick(this)">
                <input type="checkbox" class="compat-check" data-cat="intimacy">

          <!-- NÚT SUBMIT & KẾT QUẢ BIỂU ĐỒ NÂNG CẤP HIỆU ỨNG -->
          <div style="margin-top: 8px; margin-bottom: 24px;">
            <button class="calc-btn" onclick="calculateMatch()">Xem kết quả & Biểu đồ đồng điệu</button>
            
            <div id="matchResult" class="result-box" style="display:none; background:rgba(26,29,38,0.9); border:1px solid rgba(253,80,104,0.4); padding:24px 18px; border-radius:20px; margin-top:14px; backdrop-filter:blur(12px); box-shadow:0 12px 35px rgba(253,80,104,0.15);">
              
              <!-- VÒNG TRÒN NEON ĐIỂM SỐ -->

              <div id="scoreDetailRatio" style="text-align:center; font-size:0.85rem; color:#94a3b8; margin-bottom:8px;"></div>
              
              <div id="scoreText" style="font-size:0.92rem; color:#e2e8f0; line-height:1.5; text-align:center; background:rgba(19,21,28,0.7); padding:12px 16px; border-radius:12px; border-left:3px solid var(--accent); margin:10px 0 16px;"></div>

              <div class="chart-container">

    function handleTagClick(labelEl) {
      const cb = labelEl.querySelector('input[type="checkbox"]');
      cb.checked = !cb.checked;
      if (cb.checked) {
        labelEl.classList.add('active');

    // HÀM TÍNH TOÁN VÀ VẼ BIỂU ĐỒ TRỌNG SỐ VỚI HIỆU ỨNG ĐẾM SỐ
    function calculateMatch() {
      const categories = {
        aesthetic: { name: "Gu Thẩm Mỹ", total: 0, checked: 0 },
        lifestyle: { name: "Lối Sống Thể Chất", total: 0, checked: 0 },
        mindset:   { name: "Tư Duy & Giá Trị", total: 0, checked: 0 },
        intimacy:  { name: "Thân Mật & Riêng Tư", total: 0, checked: 0 }
      };

      document.querySelectorAll('.compat-check').forEach(cb => {
        const cat = cb.getAttribute('data-cat');
        if (categories[cat]) {
          categories[cat].total++;
          if (cb.checked) categories[cat].checked++;
        }
      });

      let grandTotal = 0;
      let grandChecked = 0;
      let highestCategory = "";
      let highestRatio = -1;

      Object.keys(categories).forEach(cat => {
        const item = categories[cat];
        grandTotal += item.total;
        grandChecked += item.checked;
        const ratio = item.total > 0 ? (item.checked / item.total) : 0;
        const percent = Math.round(ratio * 100);

        document.getElementById(`pct-${cat}`).innerText = `${percent}% (${item.checked}/${item.total})`;
        document.getElementById(`bar-${cat}`).style.width = `${percent}%`;

        if (ratio > highestRatio && item.checked > 0) {
          highestRatio = ratio;
          highestCategory = item.name;
        }
      });

      const overallPercent = Math.round((grandChecked / grandTotal) * 100);
      const resultBox = document.getElementById('matchResult');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const scoreDetailRatio = document.getElementById('scoreDetailRatio');
      const scoreText = document.getElementById('scoreText');
      const highestTrait = document.getElementById('highestTrait');

      scoreDetailRatio.innerText = `Đồng điệu ${grandChecked}/${grandTotal} tiêu chuẩn chung`;

      if (highestCategory) {
        highestTrait.innerText = `🔥 Tần số cao nhất: ${highestCategory}`;
      } else {
        highestTrait.innerText = "";
      }

      if (overallPercent >= 75) {
        scoreText.innerHTML = "✨ <strong>Tần số cực kỳ đồng điệu!</strong> Hai người có nhân sinh quan và gu sống chạm nhau ở hầu hết các khía cạnh.";
      } else if (overallPercent >= 45) {
        scoreText.innerHTML = "☕ <strong>Khá hài hòa ở các điểm cốt lõi.</strong> Những nét chấm phá đối lập còn lại chính là cái cớ hoàn hảo để trò chuyện.";
      } else {
        scoreText.innerHTML = "🪐 <strong>Hai cực đối lập bù trừ!</strong> Sự khác biệt lớn thường tạo ra cảm giác tò mò và bất ngờ khi tìm hiểu.";
      }

      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: 'smooth' });

      // HIỆU ỨNG SỐ NHẢY TỪ 0% ĐẾN KẾT QUẢ THỰC TẾ
      let currentVal = 0;
      scoreDisplay.innerText = "0%";
      const duration = 1000;
      const stepTime = 20;
      const totalSteps = duration / stepTime;
      const increment = overallPercent / totalSteps;

      const counterTimer = setInterval(() => {
        currentVal += increment;
        if (currentVal >= overallPercent) {
          clearInterval(counterTimer);
          scoreDisplay.innerText = overallPercent + "%";
        } else {
          scoreDisplay.innerText = Math.floor(currentVal) + "%";
        }
      }, stepTime);
    }

    let currentTopicKey = "";
    let currentQ = 0;
    let quizScore = 0;

    function getStoredScores() {
      const saved = localStorage.getItem("dating_quiz_scores");
      return saved ? JSON.parse(saved) : {
        personality: { score: null, replays: 0 },
        lifestyle: { score: null, replays: 0 },
        intimacy: { score: null, replays: 0 }
      };
    }

    function saveScore(topicKey, score) {
      const data = getStoredScores();
      if (data[topicKey].score !== null) {
        data[topicKey].replays += 1;
      }
      data[topicKey].score = score;
      localStorage.setItem("dating_quiz_scores", JSON.stringify(data));
    }

    function resetSingleTopicOnly(event, topicKey) {
      event.stopPropagation();
      const data = getStoredScores();
      data[topicKey] = { score: null, replays: 0 };
      localStorage.setItem("dating_quiz_scores", JSON.stringify(data));
      showTopicMenu();
    }

    function resetAllScores() {
      localStorage.removeItem("dating_quiz_scores");
      showTopicMenu();
    }

    function openQuizModal() {
      document.getElementById("quizModal").style.display = "flex";
      showTopicMenu();
    }

    function closeQuizModal() {
      document.getElementById("quizModal").style.display = "none";
    }

    function showTopicMenu() {
      document.getElementById("qResultArea").style.display = "none";
      document.getElementById("qArea").style.display = "none";
      document.getElementById("qProgress").innerText = "Game Hub";

      const data = getStoredScores();
      let totalEarned = 0;
      let totalPlayedQuestions = 0;
      let completedTopicsCount = 0;

      Object.keys(QUIZ_DATA_HUB).forEach(key => {
        if (data[key].score !== null) {
          totalEarned += data[key].score;
          totalPlayedQuestions += QUIZ_DATA_HUB[key].questions.length;
          completedTopicsCount++;
        }
      });

      const getActionControl = (key) => {
        const item = data[key];
        if (item.score !== null) {
          const replayText = item.replays > 0 
            ? `<span style="font-size:0.75rem; color:#ff94a4; font-style:italic;">(đã chơi lại lần thứ ${item.replays})</span>` 
            : ``;
          
          return `
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="color:#38ef7d; font-weight:700; font-size:0.85rem;">✅ ${item.score}/${QUIZ_DATA_HUB[key].questions.length}</span>
                <button title="Reset điểm phần này" style="background:#282d3f; border:1px solid #3e445b; color:#cbd5e1; border-radius:6px; padding:3px 7px; font-size:0.75rem; cursor:pointer;" onclick="resetSingleTopicOnly(event, '${key}')">🔄</button>
              </div>
              ${replayText}
            </div>
          `;
        }
        return `<span style="color:var(--text-dim); font-size:0.8rem;">Chưa chơi</span>`;
      };

      let summaryBlock = "";
      if (completedTopicsCount > 0) {
        const overallPercent = Math.round((totalEarned / totalPlayedQuestions) * 100);
        summaryBlock = `
          <div style="background:#13151c; border:1px solid #2e4760; border-radius:12px; padding:12px; text-align:center; margin-bottom:8px;">
            <p style="font-size:0.8rem; color:#94a3b8;">TỔNG ĐIỂM TÍCH LŨY</p>
            <div style="font-size:1.6rem; font-weight:800; color:#38ef7d; margin:4px 0;">
              ${totalEarned}/${totalPlayedQuestions} Điểm (${overallPercent}%)
            </div>
            <p style="font-size:0.75rem; color:#a29bfe;">Đã hoàn thành ${completedTopicsCount}/3 chủ đề</p>
          </div>
        `;
      }

      const menuHtml = `
        <div id="topicMenu" style="display:flex; flex-direction:column; gap:10px;">

            ${getActionControl('personality')}
          </button>

          <button class="quiz-opt-btn" style="display:flex; justify-content:space-between; align-items:center;" onclick="startQuiz('lifestyle')">
            <span>⚖️ 2. Quan Điểm & Lối Sống</span>
            ${getActionControl('lifestyle')}
          </button>

          <button class="quiz-opt-btn" style="display:flex; justify-content:space-between; align-items:center; border-left:3px solid #fd5068;" onclick="startQuiz('intimacy')">
            <span>🔒 3. Góc Riêng Tư & Thân Mật</span>
            ${getActionControl('intimacy')}
          </button>

          ${completedTopicsCount > 0 ? `
            <button style="background:none; border:none; color:#ff6b6b; font-size:0.78rem; cursor:pointer; text-decoration:underline; margin-top:6px; padding:4px;" onclick="resetAllScores()">
              🗑️ Đặt lại toàn bộ dữ liệu & lượt chơi
            </button>
          ` : ''}
        </div>
      `;

      let menuEl = document.getElementById("topicMenuContainer");
      if (!menuEl) {
        menuEl = document.createElement("div");
        menuEl.id = "topicMenuContainer";
        document.getElementById("qArea").parentNode.insertBefore(menuEl, document.getElementById("qArea"));
      }
      menuEl.innerHTML = menuHtml;
      menuEl.style.display = "block";
    }

    function startQuiz(topicKey) {
      currentTopicKey = topicKey;
      currentQ = 0;
      quizScore = 0;
      document.getElementById("topicMenuContainer").style.display = "none";
      document.getElementById("qArea").style.display = "block";
      renderQuestion();
    }

    function renderQuestion() {
      const topic = QUIZ_DATA_HUB[currentTopicKey];
      const qData = topic.questions[currentQ];
      
      document.getElementById("qProgress").innerText = `${topic.icon} Câu ${currentQ + 1}/${topic.questions.length}`;
      document.getElementById("qTitle").innerText = qData.q;
      
      const optContainer = document.getElementById("qOptions");
      optContainer.innerHTML = "";
      
      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optContainer.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx) {
      const topic = QUIZ_DATA_HUB[currentTopicKey];
      if (topic.questions[currentQ].matchIdx.includes(chosenIdx)) {
        quizScore++;
      }
      currentQ++;
      if (currentQ < topic.questions.length) {
        renderQuestion();
      } else {
        saveScore(currentTopicKey, quizScore);
        showQuizResult();
      }
    }

    function showQuizResult() {
      document.getElementById("qArea").style.display = "none";
      const resArea = document.getElementById("qResultArea");
      const totalQ = QUIZ_DATA_HUB[currentTopicKey].questions.length;
      const data = getStoredScores();
      const replays = data[currentTopicKey].replays;

      let msg = "";
      if (quizScore >= 4) {
        msg = "Tần số trùng khớp đáng ngạc nhiên ở chủ đề này!";
      } else if (quizScore >= 2) {
        msg = "Khá tương đồng, những điểm khác biệt chính là chủ đề hay để trò chuyện.";
      } else {
        msg = "Hai góc nhìn khá đối lập, nhưng bù trừ cho nhau cũng là điều thú vị!";
      }

      const replayBadge = replays > 0 
        ? `<div style="font-size:0.8rem; color:#ff94a4; font-style:italic;">(Bạn đã chơi lại phần này lần thứ ${replays})</div>` 
        : ``;

      resArea.innerHTML = `
        <div style="font-size: 2.2rem;">🎯</div>
        <h3 style="font-size: 1.15rem;">Hoàn thành: ${QUIZ_DATA_HUB[currentTopicKey].title}</h3>
        <div style="font-size: 2rem; font-weight: 800; color: #38ef7d;">${quizScore}/${totalQ} Điểm</div>
        ${replayBadge}
        <p style="font-size: 0.88rem; color: #94a3b8; line-height: 1.4; margin-top:4px;">${msg}</p>
        
        <button class="quiz-launcher-btn" style="margin-top: 6px; background:linear-gradient(45deg, #10b981, #059669);" onclick="startQuiz('${currentTopicKey}')">
          🔄 Chơi lại ngay phần này
        </button>

        <button class="quiz-launcher-btn" onclick="showTopicMenu()">
          📊 Xem tổng điểm & Danh mục khác
        </button>
        
        <button class="quiz-opt-btn" style="text-align: center;" onclick="closeQuizModal()">
          Quay lại hồ sơ chính
        </button>
      `;
      resArea.style.display = "flex";
    }
  </script>
