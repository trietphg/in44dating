<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dating Profile</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #fd5068;
      --accent-grad: linear-gradient(45deg, #ff6036, #fd5068);
      --quiz-grad: linear-gradient(45deg, #6c5ce7, #a29bfe);
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --border: #2a2e3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* MÀN HÌNH KHÓA BAN ĐẦU */
    #lock-screen {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #lock-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lock-screen p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
    
    .input-box { display: flex; flex-direction: column; gap: 12px; }
    .password-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
    input#passInput {
      width: 100%;
      padding: 12px 42px 12px 16px;
      background: #13151c;
      border: 1px solid #363b4e;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input#passInput:focus { border-color: var(--accent); }
    
    .eye-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }
    .eye-btn:hover { color: #fff; }
    .eye-btn svg { width: 20px; height: 20px; fill: currentColor; }

    button.unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-grad);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.unlock-btn:hover { opacity: 0.9; }

    #error-msg {
      color: #ff6b6b;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* BỐ CỤC KHUNG HỒ SƠ CHÍNH */
    #app { display: none; width: 100%; max-width: 900px; margin: auto; }
    .profile-layout {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* RESPONSIVE TRÊN LAPTOP / MÀN HÌNH LỚN (> 850px) */
    @media (min-width: 850px) {
      .profile-layout {
        display: grid;
        grid-template-columns: 340px 1fr;
        gap: 24px;
        align-items: start;
      }
      .left-column {
        position: sticky;
        top: 24px;
      }
      .right-column {
        max-height: 92vh;
        overflow-y: auto;
        padding-right: 8px;
      }
      /* Tùy chỉnh thanh cuộn bên phải */
      .right-column::-webkit-scrollbar { width: 6px; }
      .right-column::-webkit-scrollbar-track { background: #13151c; border-radius: 4px; }
      .right-column::-webkit-scrollbar-thumb { background: #363b4e; border-radius: 4px; }
      .right-column::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    }

    /* THẺ THÔNG TIN CỐ ĐỊNH BÊN TRÁI */
    .identity-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cover-photo { width: 100%; height: 320px; position: relative; background: #252836; }
    .cover-photo img { width: 100%; height: 100%; object-fit: cover; }
    .identity-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    
    .id-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      border-bottom: 1px dashed #282c3c;
      padding-bottom: 8px;
    }
    .id-row:last-child { border-bottom: none; padding-bottom: 0; }
    .id-label { color: var(--text-dim); }
    .id-val { font-weight: 600; color: #f1f5f9; text-align: right; }

    /* CỘT NỘI DUNG CUỘN BÊN PHẢI */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .section-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    .section-title { font-size: 0.95rem; font-weight: 700; color: #ff7b90; display: flex; align-items: center; gap: 6px; }
    .section-desc { font-size: 0.88rem; color: #d0d4dc; line-height: 1.5; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag-item {
      background: #262a38;
      border: 1px solid #363b4e;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      color: #e2e8f0;
    }
    .checklist-prompt {
      background: rgba(253, 80, 104, 0.1);
      border: 1px dashed var(--accent);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #ff94a4;
      line-height: 1.45;
    }
    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #13151c;
      padding: 11px 13px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      border: 1px solid #282d3f;
      transition: border-color 0.2s;
    }
    .check-item:hover { border-color: var(--accent); }
    .check-item input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
    .check-item label { font-size: 0.85rem; color: #cbd5e1; cursor: pointer; flex: 1; }
    
    .calc-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent-grad);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }
    .result-box {
      display: none;
      background: #18222d;
      border: 1px solid #2e4760;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      margin-top: 8px;
    }
    .score-num { font-size: 1.8rem; font-weight: 800; color: #38ef7d; margin-bottom: 4px; }
    .score-comment { font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }

    /* NÚT VÀ GIAO DIỆN MODAL GAME HUB */
    .quiz-launcher-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--quiz-grad);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
    }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid #363b4e;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .quiz-header { display: flex; justify-content: space-between; align-items: center; }
    .quiz-progress { font-size: 0.85rem; color: #a29bfe; font-weight: 600; }
    .quiz-close { background: none; border: none; color: #9aa0a6; font-size: 1.3rem; cursor: pointer; }
    .quiz-question { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-opt-btn {
      background: #13151c;
      border: 1px solid #2e3346;
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      color: #e2e8f0;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quiz-opt-btn:hover { border-color: #a29bfe; background: #212536; }
    .quiz-result-view { text-align: center; display: none; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH KHÓA BAN ĐẦU -->
  <div id="lock-screen">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <h2>Trang cá nhân giới hạn</h2>
    <p>Nhập Passcode để mở khóa toàn bộ hồ sơ.</p>
    
    <div class="input-box">
      <div class="password-wrapper">
        <input type="password" id="passInput" placeholder="Nhập Passcode..." autofocus onkeydown="if(event.key==='Enter') unlockSite()">
        <button type="button" class="eye-btn" onclick="togglePasswordVisibility()" aria-label="Hiện/Ẩn mật mã">
          <svg id="eye-icon-open" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          <svg id="eye-icon-closed" style="display: none;" viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/></svg>
        </button>
      </div>
      <button class="unlock-btn" onclick="unlockSite()">Mở khóa hồ sơ</button>
    </div>
    <div id="error-msg"></div>
  </div>

  <!-- NƠI CHỨA HỒ SƠ 2 CỘT SAU MỞ KHÓA -->
  <main id="app"></main>

  <script>
    let failedAttempts = 0;

    function togglePasswordVisibility() {
      const passInput = document.getElementById("passInput");
      const iconOpen = document.getElementById("eye-icon-open");
      const iconClosed = document.getElementById("eye-icon-closed");
      if (passInput.type === "password") {
        passInput.type = "text";
        iconOpen.style.display = "none";
        iconClosed.style.display = "block";
      } else {
        passInput.type = "password";
        iconOpen.style.display = "block";
        iconClosed.style.display = "none";
      }
    }

    // BỐ CỤC GIAO DIỆN 2 CỘT (DESKTOP) HOẶC 1 CỘT (MOBILE)
    const RAW_HTML = `
      <div class="profile-layout">
        
        <!-- CỘT TRÁI: THÔNG TIN CĂN CƯỚC CỐ ĐỊNH & NÚT MỞ GAME HUB -->
        <aside class="left-column">
          <div class="identity-card">
            <div class="cover-photo">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80" alt="Avatar">
            </div>
            <div class="identity-body">
              <div class="id-row">
                <span class="id-label">Họ và tên</span>
                <span class="id-val" style="color:#ff7b90; font-size:1rem;">Phạm Gia Triết</span>
              </div>
              <div class="id-row">
                <span class="id-label">Năm sinh / Tuổi</span>
                <span class="id-val">2005 (21 tuổi)</span>
              </div>
              <div class="id-row">
                <span class="id-label">Cung hoàng đạo</span>
                <span class="id-val">Xử Nữ (Virgo ♍)</span>
              </div>
              <div class="id-row">
                <span class="id-label">Khu vực sống</span>
                <span class="id-val">TP. Hồ Chí Minh</span>
              </div>
              <div class="id-row">
                <span class="id-label">Chuyên môn</span>
                <span class="id-val">Luật & Kiến trúc</span>
              </div>
              <div class="id-row">
                <span class="id-label">Tình trạng</span>
                <span class="id-val" style="color:#38ef7d;">Đang tìm hiểu ✨</span>
              </div>

              <!-- NÚT MỞ TRÒ CHƠI NẰM CỐ ĐỊNH NGAY DƯỚI THẺ CĂN CƯỚC -->
              <button class="quiz-launcher-btn" style="margin-top:6px;" onclick="openQuizModal()">
                🎮 Mini-Game: Thử Độ Ăn Ý
              </button>
            </div>
          </div>
        </aside>

        <!-- CỘT PHẢI: CHI TIẾT SỞ THÍCH, NGUYÊN TẮC & CHECKBOX TƯƠNG THÍCH -->
        <section class="right-column">
          <div class="checklist-prompt">
            💡 <strong>Interactive Check:</strong> Đọc từng phần dưới đây, nếu thấy đồng điệu hoặc cùng tần số, hãy tích vào ô checkbox. Cuối trang có nút chấm điểm tương thích của hai ta!
          </div>

          <!-- PHẦN 1: GIỚI THIỆU CHUNG -->
          <div class="section-box">
            <div class="section-title">👤 Tổng quan bản thân</div>
            <div class="section-desc">Kỷ luật, thích sự rõ ràng và chiều sâu. Quan tâm đến kiến trúc, tư duy pháp lý, âm nhạc và những buổi dạo phố đêm tĩnh lặng.</div>
            <div class="tag-list">
              <span class="tag-item">☕ Cà phê rang mộc</span>
              <span class="tag-item">🎶 Indie & Trữ tình</span>
              <span class="tag-item">⚖️ Pháp lý & Tư duy</span>
              <span class="tag-item">🏛️ Kiến trúc</span>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c1">
              <label for="c1">Thích người sống kỷ luật, tư duy rõ ràng và biết quan tâm</label>
            </div>
          </div>

          <!-- PHẦN 2: PHONG CÁCH SỐNG & THỂ CHẤT -->
          <div class="section-box">
            <div class="section-title">⚡ Phong cách sống & Thể chất</div>
            <div class="section-desc">Rèn luyện thể thao đều đặn (gym, bơi lội), duy trì vóc dáng thon gọn săn chắc. Ưa chuộng không gian riêng tư, nhẹ nhàng thay vì tụ tập xô bồ.</div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c2">
              <label for="c2">Cùng gu thích không gian chill nhẹ nhàng, không xô bồ</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c3">
              <label for="c3">Ủng hộ lối sống kỷ luật thể chất, gọn gàng và chăm sóc bản thân</label>
            </div>
          </div>

          <!-- PHẦN 3: NGUYÊN TẮC HẸN HÒ -->
          <div class="section-box">
            <div class="section-title">🎯 Quan điểm kết nối & Hẹn hò</div>
            <div class="section-desc">Ưu tiên giao tiếp chân thành, tôn trọng ranh giới và công việc của nhau. Thích những buổi trò chuyện sâu về nhân sinh quan hơn là những câu chuyện xã giao.</div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c4">
              <label for="c4">Thích trò chuyện thẳng thắn, không im lặng khi có khúc mắc</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c5">
              <label for="c5">Tôn trọng không gian riêng tư và mục tiêu cá nhân của nhau</label>
            </div>
          </div>

          <!-- PHẦN 4: GÓC RIÊNG TƯ / XHTD -->
          <div class="section-box" style="border-left: 4px solid var(--accent);">
            <div class="section-title">🔒 Góc riêng tư / Thân mật & XHTD</div>
            <div class="section-desc">Cần sự gắn kết cảm xúc và sự tin cậy nhất định trước khi bước vào những cử chỉ thân mật. Tôn trọng sự đồng thuận (consent) tuyệt đối, an toàn và chu đáo.</div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c6">
              <label for="c6">Đồng điệu: Cảm xúc gắn bó là nền tảng của sự thân mật</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c7">
              <label for="c7">Thoải mái trò chuyện cởi mở về mong muốn và giới hạn của nhau</label>
            </div>
          </div>

          <!-- NÚT CHẤM ĐIỂM CHECKBOX -->
          <div style="margin-top: 4px; margin-bottom: 24px;">
            <button class="calc-btn" onclick="calculateMatch()">Xem độ hợp nhau của tụi mình</button>
            <div id="matchResult" class="result-box">
              <div id="scoreDisplay" class="score-num">0%</div>
              <div id="scoreText" class="score-comment"></div>
            </div>
          </div>
        </section>
      </div>

      <!-- MODAL POP-UP TRẮC NGHIỆM -->
      <div id="quizModal" class="modal-overlay">
        <div class="quiz-card">
          <div class="quiz-header">
            <span id="qProgress" class="quiz-progress">Game Hub</span>
            <button class="quiz-close" onclick="closeQuizModal()">&times;</button>
          </div>
          <div id="qArea">
            <div id="qTitle" class="quiz-question"></div>
            <div id="qOptions" class="quiz-options" style="margin-top: 14px;"></div>
          </div>
          <div id="qResultArea" class="quiz-result-view"></div>
        </div>
      </div>
    `;

    function unlockSite() {
      const pass = document.getElementById("passInput").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const lockScreen = document.getElementById("lock-screen");
      const app = document.getElementById("app");

      if (pass === "noinaycotui") {
        lockScreen.style.display = "none";
        app.innerHTML = RAW_HTML;
        app.style.display = "block";
        errorMsg.style.display = "none";
      } else {
        failedAttempts++;
        errorMsg.innerText = `Bạn đã nhập sai lần thứ ${failedAttempts}!`;
        errorMsg.style.display = "block";
        errorMsg.style.animation = 'none';
        errorMsg.offsetHeight;
        errorMsg.style.animation = 'shake 0.3s ease-in-out';
      }
    }

    function calculateMatch() {
      const checkboxes = document.querySelectorAll('.compat-check');
      const total = checkboxes.length;
      let checkedCount = 0;

      checkboxes.forEach(cb => {
        if (cb.checked) checkedCount++;
      });

      const percent = Math.round((checkedCount / total) * 100);
      const resultBox = document.getElementById('matchResult');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const scoreText = document.getElementById('scoreText');

      scoreDisplay.innerText = percent + "% (" + checkedCount + "/" + total + " điểm)";
      if (percent >= 80) {
        scoreText.innerText = "Tần số trùng khớp đáng kinh ngạc! Rất nhiều điểm chung về tư duy và lối sống.";
      } else if (percent >= 50) {
        scoreText.innerText = "Khá tương đồng ở những điểm mấu chốt. Những góc khác biệt sẽ là đề tài trò chuyện rất cuốn hút.";
      } else {
        scoreText.innerText = "Hai thế giới có vẻ khá đối lập, nhưng bù trừ cho nhau lại tạo nên sức hút lạ!";
      }

      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    const QUIZ_DATA_HUB = {
      personality: {
        title: "Tính Cách & Sở Thích",
        icon: "🎨",
        questions: [
          {
            q: "1. Không gian lý tưởng cho buổi hẹn hò đầu tiên?",

          },
          {

          },
          {

          },
          {

            opts: ["Rất quan trọng, phải giữ kỷ luật tập luyện săn chắc", "Hứng thì tập, không thì thôi", "Thích nằm lướt điện thoại hơn vận động"],
            matchIdx: [0]
          },
          {
            q: "5. Khi gặp người mới quen, cách bắt chuyện bạn thấy thích nhất?",
            opts: ["Nhắn tin từ tốn, lịch sự và có chủ đề sâu sắc", "Spam meme và icon liên tục", "Gọi điện thoại trực tiếp"],
            matchIdx: [0]
          }
        ]
      },
      lifestyle: {
        title: "Quan Điểm Sống & Kết Nối",
        icon: "⚖️",
        questions: [
          {
            q: "1. Khi cả hai có bất đồng ý kiến hoặc hiểu lầm:",
            opts: ["Im lặng vài ngày chiến tranh lạnh", "Thẳng thắn ngồi lại giải quyết rõ ràng ngay", "Đăng story bóng gió cho đối phương tự hiểu"],
            matchIdx: [1]
          },
          {
            q: "2. Không gian riêng tư khi trong mối quan hệ:",
            opts: ["Cần kiểm soát mọi tin nhắn và tài khoản mạng xã hội", "Tôn trọng công việc, thời gian riêng và bạn bè của nhau", "Không quan tâm đối phương làm gì"],
            matchIdx: [1]
          },
          {

            opts: ["Kỷ luật tạo ra tự do và sự tin cậy lâu dài", "Sống tùy hứng, tới đâu tính tới đó", "Có kế hoạch nhưng hay trì hoãn"],
            matchIdx: [0]
          },
          {
            q: "4. Định hướng khi bắt đầu một mối quan hệ:",
            opts: ["Mập mờ ngắn hạn, không ràng buộc", "Tìm hiểu nghiêm túc để hướng đến sự đồng hành bền vững", "Tùy duyên, không có tiêu chuẩn"],
            matchIdx: [1]
          },
          {
            q: "5. Cách chia sẻ chi phí trong các buổi hẹn:",
            opts: ["Một người bao trọn toàn bộ", "Cùng nhau chia sẻ linh hoạt và thoải mái", "Tính toán chi li từng nghìn lẻ"],
            matchIdx: [1]
          }
        ]
      },
      intimacy: {
        title: "Góc Riêng Tư & Thân Mật (18+)",
        icon: "🔒",
        questions: [
          {
            q: "1. Điều kiện tiên quyết để bước vào sự thân mật thể xác:",
            opts: ["Cần có cảm xúc gắn bó và sự tin tưởng rõ ràng", "Chỉ cần thấy đối phương thu hút về ngoại hình là đủ", "Tùy thuộc vào không khí lúc đó"],
            matchIdx: [0]
          },
          {
            q: "2. Mức độ cởi mở khi trao đổi về mong muốn & giới hạn:",
            opts: ["Thẳng thắn chia sẻ những gì mình thích và không thích", "Ngại ngùng, không dám nói, để đối phương tự đoán", "Cho rằng không cần thiết phải bàn bạc trước"],
            matchIdx: [0]
          },
          {
            q: "3. Quan điểm về sự đồng thuận (Consent) và an toàn:",
            opts: ["Bắt buộc phải có sự đồng thuận thoải mái và biện pháp an toàn", "Xem nhẹ, thích theo cảm xúc bộc phát", "Không quan tâm lắm"],
            matchIdx: [0]
          },
          {
            q: "4. Nhịp độ tiến triển từ làm quen đến thân mật gần gũi:",
            opts: ["Chậm mà chắc, ưu tiên hiểu tính cách trước", "Càng nhanh càng tốt", "Để mọi thứ diễn ra tự nhiên theo cảm xúc cả hai"],
            matchIdx: [0, 2]
          },
          {
            q: "5. Sau những khoảnh khắc gần gũi, bạn mong đợi điều gì?",
            opts: ["Nằm ôm trò chuyện, thể hiện sự quan tâm và kết nối", "Ai về nhà nấy, không cần liên lạc nhiều", "Cảm thấy bình thường như mọi lúc"],
            matchIdx: [0]
          }
        ]
      }
    };

    let currentTopicKey = "";
    let currentQ = 0;
    let quizScore = 0;

    function getStoredScores() {
      const saved = localStorage.getItem("dating_quiz_scores");
      return saved ? JSON.parse(saved) : {
        personality: { score: null, replays: 0 },
        lifestyle: { score: null, replays: 0 },
        intimacy: { score: null, replays: 0 }
      };
    }

    function saveScore(topicKey, score) {
      const data = getStoredScores();
      if (data[topicKey].score !== null) {
        data[topicKey].replays += 1;
      }
      data[topicKey].score = score;
      localStorage.setItem("dating_quiz_scores", JSON.stringify(data));
    }

    // ĐẶT LẠI ĐIỂM MỘT CHỦ ĐỀ: CHỈ RESET VỀ BAN ĐẦU, KHÔNG TỰ NHẢY VÀO GAME
    function resetSingleTopicOnly(event, topicKey) {
      event.stopPropagation(); // Ngăn sự kiện bấm nhầm vào nút mở game
      const data = getStoredScores();
      data[topicKey] = { score: null, replays: 0 };
      localStorage.setItem("dating_quiz_scores", JSON.stringify(data));
      showTopicMenu(); // Vẽ lại menu để hiện lại trạng thái "Chưa chơi"
    }

    function resetAllScores() {
      localStorage.removeItem("dating_quiz_scores");
      showTopicMenu();
    }

    function openQuizModal() {
      document.getElementById("quizModal").style.display = "flex";
      showTopicMenu();
    }

    function closeQuizModal() {
      document.getElementById("quizModal").style.display = "none";
    }

    function showTopicMenu() {
      document.getElementById("qResultArea").style.display = "none";
      document.getElementById("qArea").style.display = "none";
      document.getElementById("qProgress").innerText = "Game Hub";

      const data = getStoredScores();
      let totalEarned = 0;
      let totalPlayedQuestions = 0;
      let completedTopicsCount = 0;

      Object.keys(QUIZ_DATA_HUB).forEach(key => {
        if (data[key].score !== null) {
          totalEarned += data[key].score;
          totalPlayedQuestions += QUIZ_DATA_HUB[key].questions.length;
          completedTopicsCount++;
        }
      });

      const getActionControl = (key) => {
        const item = data[key];
        if (item.score !== null) {
          const replayText = item.replays > 0 
            ? `<span style="font-size:0.75rem; color:#ff94a4; font-style:italic;">(đã chơi lại lần thứ ${item.replays})</span>` 
            : ``;
          
          return `
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="color:#38ef7d; font-weight:700; font-size:0.85rem;">✅ ${item.score}/${QUIZ_DATA_HUB[key].questions.length}</span>
                <button title="Reset điểm phần này" style="background:#282d3f; border:1px solid #3e445b; color:#cbd5e1; border-radius:6px; padding:3px 7px; font-size:0.75rem; cursor:pointer;" onclick="resetSingleTopicOnly(event, '${key}')">🔄</button>
              </div>
              ${replayText}
            </div>
          `;
        }
        return `<span style="color:var(--text-dim); font-size:0.8rem;">Chưa chơi</span>`;
      };

      let summaryBlock = "";
      if (completedTopicsCount > 0) {
        const overallPercent = Math.round((totalEarned / totalPlayedQuestions) * 100);
        summaryBlock = `
          <div style="background:#13151c; border:1px solid #2e4760; border-radius:12px; padding:12px; text-align:center; margin-bottom:8px;">
            <p style="font-size:0.8rem; color:#94a3b8;">TỔNG ĐIỂM TÍCH LŨY</p>
            <div style="font-size:1.6rem; font-weight:800; color:#38ef7d; margin:4px 0;">
              ${totalEarned}/${totalPlayedQuestions} Điểm (${overallPercent}%)
            </div>
            <p style="font-size:0.75rem; color:#a29bfe;">Đã hoàn thành ${completedTopicsCount}/3 chủ đề</p>
          </div>
        `;
      }

      const menuHtml = `
        <div id="topicMenu" style="display:flex; flex-direction:column; gap:10px;">
          ${summaryBlock}
          <p style="font-size:0.85rem; color:var(--text-dim); text-align:center; margin-bottom:2px;">
            Chọn chủ đề để bắt đầu (bấm 🔄 để reset điểm):
          </p>

          <button class="quiz-opt-btn" style="display:flex; justify-content:space-between; align-items:center;" onclick="startQuiz('personality')">
            <span>🎨 1. Tính Cách & Sở Thích</span>
            ${getActionControl('personality')}
          </button>

          <button class="quiz-opt-btn" style="display:flex; justify-content:space-between; align-items:center;" onclick="startQuiz('lifestyle')">
            <span>⚖️ 2. Quan Điểm & Lối Sống</span>
            ${getActionControl('lifestyle')}
          </button>

          <button class="quiz-opt-btn" style="display:flex; justify-content:space-between; align-items:center; border-left:3px solid #fd5068;" onclick="startQuiz('intimacy')">
            <span>🔒 3. Góc Riêng Tư & Thân Mật</span>
            ${getActionControl('intimacy')}
          </button>

          ${completedTopicsCount > 0 ? `
            <button style="background:none; border:none; color:#ff6b6b; font-size:0.78rem; cursor:pointer; text-decoration:underline; margin-top:6px; padding:4px;" onclick="resetAllScores()">
              🗑️ Đặt lại toàn bộ dữ liệu & lượt chơi
            </button>
          ` : ''}
        </div>
      `;

      let menuEl = document.getElementById("topicMenuContainer");
      if (!menuEl) {
        menuEl = document.createElement("div");
        menuEl.id = "topicMenuContainer";
        document.getElementById("qArea").parentNode.insertBefore(menuEl, document.getElementById("qArea"));
      }
      menuEl.innerHTML = menuHtml;
      menuEl.style.display = "block";
    }

    function startQuiz(topicKey) {
      currentTopicKey = topicKey;
      currentQ = 0;
      quizScore = 0;
      document.getElementById("topicMenuContainer").style.display = "none";
      document.getElementById("qArea").style.display = "block";
      renderQuestion();
    }

    function renderQuestion() {
      const topic = QUIZ_DATA_HUB[currentTopicKey];
      const qData = topic.questions[currentQ];
      
      document.getElementById("qProgress").innerText = `${topic.icon} Câu ${currentQ + 1}/${topic.questions.length}`;
      document.getElementById("qTitle").innerText = qData.q;
      
      const optContainer = document.getElementById("qOptions");
      optContainer.innerHTML = "";
      
      qData.opts.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt-btn";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optContainer.appendChild(btn);
      });
    }

    function selectAnswer(chosenIdx) {
      const topic = QUIZ_DATA_HUB[currentTopicKey];
      if (topic.questions[currentQ].matchIdx.includes(chosenIdx)) {
        quizScore++;
      }
      currentQ++;
      if (currentQ < topic.questions.length) {
        renderQuestion();
      } else {
        saveScore(currentTopicKey, quizScore);
        showQuizResult();
      }
    }

    function showQuizResult() {
      document.getElementById("qArea").style.display = "none";
      const resArea = document.getElementById("qResultArea");
      const totalQ = QUIZ_DATA_HUB[currentTopicKey].questions.length;
      const data = getStoredScores();
      const replays = data[currentTopicKey].replays;

      let msg = "";
      if (quizScore >= 4) {
        msg = "Tần số trùng khớp đáng ngạc nhiên ở chủ đề này!";
      } else if (quizScore >= 2) {
        msg = "Khá tương đồng, những điểm khác biệt chính là chủ đề hay để trò chuyện.";
      } else {
        msg = "Hai góc nhìn khá đối lập, nhưng bù trừ cho nhau cũng là điều thú vị!";
      }

      const replayBadge = replays > 0 
        ? `<div style="font-size:0.8rem; color:#ff94a4; font-style:italic;">(Bạn đã chơi lại phần này lần thứ ${replays})</div>` 
        : ``;

      resArea.innerHTML = `
        <div style="font-size: 2.2rem;">🎯</div>
        <h3 style="font-size: 1.15rem;">Hoàn thành: ${QUIZ_DATA_HUB[currentTopicKey].title}</h3>
        <div style="font-size: 2rem; font-weight: 800; color: #38ef7d;">${quizScore}/${totalQ} Điểm</div>
        ${replayBadge}
        <p style="font-size: 0.88rem; color: #94a3b8; line-height: 1.4; margin-top:4px;">${msg}</p>
        
        <button class="quiz-launcher-btn" style="margin-top: 6px; background:linear-gradient(45deg, #10b981, #059669);" onclick="startQuiz('${currentTopicKey}')">
          🔄 Chơi lại ngay phần này
        </button>

        <button class="quiz-launcher-btn" onclick="showTopicMenu()">
          📊 Xem tổng điểm & Danh mục khác
        </button>
        
        <button class="quiz-opt-btn" style="text-align: center;" onclick="closeQuizModal()">
          Quay lại hồ sơ chính
        </button>
      `;
      resArea.style.display = "flex";
    }
  </script>
</body>
