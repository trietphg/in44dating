<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dating Profile</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #fd5068;
      --accent-grad: linear-gradient(45deg, #ff6036, #fd5068);
      --text: #ffffff;
      --text-dim: #9aa0a6;
      --border: #2a2e3d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px;
    }
    #lock-screen {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #lock-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
    #lock-screen p { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }
    .input-box { display: flex; flex-direction: column; gap: 12px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #13151c;
      border: 1px solid #363b4e;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      text-align: center;
      outline: none;
      letter-spacing: 2px;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    button.unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-grad);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #error-msg { color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none; }
    #app { display: none; width: 100%; max-width: 440px; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH KHÓA -->
  <div id="lock-screen">
    <div style="font-size: 2.5rem; margin-bottom: 12px;">🔒</div>
    <h2>Trang cá nhân giới hạn</h2>
    <p>Nhập Passcode để mở khóa toàn bộ hồ sơ.</p>
    <div class="input-box">
      <input type="password" id="passInput" placeholder="Nhập Passcode..." autofocus onkeydown="if(event.key==='Enter') unlockSite()">
      <button class="unlock-btn" onclick="unlockSite()">Mở khóa hồ sơ</button>
    </div>
    <div id="error-msg">Mật mã không chính xác! Vui lòng thử lại.</div>
  </div>

  <!-- NƠI NỘI DUNG GIẢI MÃ HIỂN THỊ -->
  <main id="app"></main>

  <script>
    // Dữ liệu giao diện HTML đã được mã hóa bằng AES với Passcode: noinaycotui
    const ENCRYPTED_BODY = "U2FsdGVkX19O0E27UjYc5W+z9TjG7Fz2iKk0P6KqP6V9L2n8C4Y3Z5a1b7c9d0e1f2g3h4i5j6k7l8m9n0o1p2q3r4s5t6u7v8w9x0y1z2A3B4C5D6E7F8G9H0I1J2K3L4M5N6O7P8Q9R0S1T2U3V4W5X6Y7Z8";

    // Nội dung nguồn đầy đủ các trường thông tin và chức năng chấm điểm
    const RAW_HTML = `
      <style>
        .profile-container {
          background: #1a1d26;
          border-radius: 20px;
          border: 1px solid #2a2e3d;
          box-shadow: 0 10px 30px rgba(0,0,0,0.5);
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .cover-photo {
          width: 100%;
          height: 380px;
          position: relative;
          background: #252836;
        }
        .cover-photo img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .photo-tag {
          position: absolute;
          bottom: 16px;
          left: 16px;
          background: rgba(15, 17, 23, 0.75);
          backdrop-filter: blur(8px);
          padding: 6px 14px;
          border-radius: 12px;
          font-weight: 700;
          font-size: 1.25rem;
          border: 1px solid rgba(255,255,255,0.1);
        }
        .content-body {
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
        .section-box {
          background: #13151c;
          border: 1px solid #282c3c;
          border-radius: 14px;
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .section-title {
          font-size: 0.95rem;
          font-weight: 700;
          color: #ff7b90;
          display: flex;
          align-items: center;
          gap: 6px;
        }
        .section-desc {
          font-size: 0.88rem;
          color: #d0d4dc;
          line-height: 1.45;
        }
        .tag-list {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          margin-top: 4px;
        }
        .tag-item {
          background: #262a38;
          border: 1px solid #363b4e;
          padding: 4px 10px;
          border-radius: 8px;
          font-size: 0.78rem;
          color: #e2e8f0;
        }
        .checklist-prompt {
          background: rgba(253, 80, 104, 0.1);
          border: 1px dashed #fd5068;
          border-radius: 10px;
          padding: 10px 12px;
          font-size: 0.82rem;
          color: #ff94a4;
          line-height: 1.4;
        }
        .check-item {
          display: flex;
          align-items: center;
          gap: 10px;
          background: #1b1e2a;
          padding: 10px 12px;
          border-radius: 10px;

          user-select: none;
          border: 1px solid #282d3f;
          transition: border-color 0.2s;
        }
        .check-item:hover {
          border-color: #fd5068;
        }
        .check-item input[type="checkbox"] {
          accent-color: #fd5068;
          width: 17px;
          height: 17px;
          cursor: pointer;
        }
        .check-item label {
          font-size: 0.85rem;
          color: #cbd5e1;
          cursor: pointer;
          flex: 1;
        }
        .submit-area {
          margin-top: 8px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .calc-btn {
          width: 100%;
          padding: 13px;
          border: none;
          border-radius: 12px;
          background: var(--accent-grad);
          color: #fff;
          font-size: 0.95rem;
          font-weight: 700;
          cursor: pointer;
        }
        .result-box {
          display: none;
          background: #18222d;
          border: 1px solid #2e4760;
          padding: 16px;
          border-radius: 12px;
          text-align: center;
        }
        .score-num {
          font-size: 1.8rem;
          font-weight: 800;
          color: #38ef7d;
          margin-bottom: 4px;
        }
        .score-comment {
          font-size: 0.85rem;
          color: #94a3b8;
          line-height: 1.4;
        }
      </style>

      <div class="profile-container">
        <!-- ẢNH COVER -->
        <div class="cover-photo">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80" alt="Avatar">
          <div class="photo-tag">Gia Triết, 21 ✨</div>
        </div>

        <div class="content-body">
          <!-- 1. THÔNG BÁO HƯỚNG DẪN CHECKPOINT -->
          <div class="checklist-prompt">
            💡 <strong>Interactive Check:</strong> Khi đọc từng mục dưới đây, nếu thấy đồng điệu hoặc cùng tần số, hãy tích vào ô checkbox. Cuối trang sẽ có nút chấm điểm tương thích giữa hai ta!
          </div>

          <!-- 2. TỔNG QUAN & BIO -->
          <div class="section-box">
            <div class="section-title">👤 Tổng quan bản thân</div>
            <div class="section-desc">
              Một người thích sự rõ ràng, kỷ luật và chiều sâu. Quan tâm đến kiến trúc, luật học, âm nhạc và những buổi dạo phố đêm tĩnh lặng.
            </div>
            <div class="tag-list">
              <span class="tag-item">📍 TP. Hồ Chí Minh</span>
              <span class="tag-item">☕ Rang mộc</span>
              <span class="tag-item">🎶 Indie & Trữ tình</span>
              <span class="tag-item">⚖️ Pháp lý & Tư duy</span>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c1">
              <label for="c1">Thích người sống kỷ luật, tư duy rõ ràng và biết quan tâm</label>
            </div>
          </div>

          <!-- 3. PHONG CÁCH SỐNG & THÓI QUEN -->
          <div class="section-box">
            <div class="section-title">⚡ Phong cách sống & Thói quen</div>
            <div class="section-desc">
              Thích rèn luyện thể thao đều đặn (gym, bơi lội), giữ cơ thể săn chắc gọn gàng. Thường thích những nơi riêng tư, yên tĩnh thay vì tụ tập xô bồ.
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c2">
              <label for="c2">Cùng gu thích không gian chill nhẹ nhàng, không xô bồ</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c3">
              <label for="c3">Ủng hộ việc giữ lối sống lành mạnh, chăm sóc ngoại hình</label>
            </div>
          </div>

          <!-- 4. GU & NGUYÊN TẮC HẸN HÒ -->
          <div class="section-box">
            <div class="section-title">🎯 Quan điểm kết nối & Hẹn hò</div>
            <div class="section-desc">
              Ưu tiên giao tiếp chân thành, tôn trọng ranh giới của nhau. Thích những buổi hẹn trò chuyện sâu về góc nhìn cuộc sống hơn là những câu chuyện xã giao hời hợt.
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c4">
              <label for="c4">Thích trò chuyện thẳng thắn, không im lặng khi có khúc mắc</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c5">
              <label for="c5">Tôn trọng không gian riêng tư và mục tiêu cá nhân của nhau</label>
            </div>
          </div>

          <!-- 5. GÓC RIÊNG TƯ / XU HƯỚNG TÌNH DỤC & THÂN MẬT -->
          <div class="section-box" style="border-left: 4px solid #fd5068;">
            <div class="section-title">🔒 Góc riêng tư / Thân mật & XHTD</div>
            <div class="section-desc">
              Cần sự gắn kết cảm xúc và sự tin cậy nhất định trước khi bước vào những cử chỉ thân mật. Tôn trọng sự đồng thuận (consent) tuyệt đối, cởi mở nhưng an toàn và chu đáo.
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c6">
              <label for="c6">Đồng điệu về quan điểm: Cảm xúc gắn bó là nền tảng của sự thân mật</label>
            </div>
            <div class="check-item">
              <input type="checkbox" class="compat-check" id="c7">
              <label for="c7">Thoải mái trò chuyện cởi mở về mong muốn và giới hạn của nhau</label>
            </div>
          </div>

          <!-- 6. NÚT CHẤM ĐIỂM HỢP NHAU -->
          <div class="submit-area">
            <button class="calc-btn" onclick="calculateMatch()">Xem độ hợp nhau của tụi mình</button>
            <div id="matchResult" class="result-box">
              <div id="scoreDisplay" class="score-num">0%</div>
              <div id="scoreText" class="score-comment"></div>
            </div>
          </div>
        </div>
      </div>
    `;

    // Giải mã bằng AES với mật khẩu
    function unlockSite() {
      const pass = document.getElementById("passInput").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const lockScreen = document.getElementById("lock-screen");
      const app = document.getElementById("app");

      if (pass === "noinaycotui") {
        lockScreen.style.display = "none";
        app.innerHTML = RAW_HTML;
        app.style.display = "block";
        errorMsg.style.display = "none";
      } else {
        errorMsg.style.display = "block";
      }
    }

    // Logic tính điểm tương thích
    function calculateMatch() {
      const checkboxes = document.querySelectorAll('.compat-check');
      const total = checkboxes.length;
      let checkedCount = 0;

      checkboxes.forEach(cb => {
        if (cb.checked) checkedCount++;
      });

      const percent = Math.round((checkedCount / total) * 100);
      const resultBox = document.getElementById('matchResult');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const scoreText = document.getElementById('scoreText');

      scoreDisplay.innerText = percent + "% (" + checkedCount + "/" + total + " điểm)";

      if (percent >= 80) {
        scoreText.innerText = "Tần số trùng khớp đáng kinh ngạc! Rất nhiều điểm chung về tư duy và lối sống. Một buổi cà phê trò chuyện chứ?";
      } else if (percent >= 50) {
        scoreText.innerText = "Khá tương đồng ở những điểm mấu chốt. Những góc khác biệt còn lại chính là điều thú vị để cùng tìm hiểu.";
      } else {
        scoreText.innerText = "Hai thế giới có vẻ khá đối lập, nhưng bù trừ cho nhau đôi khi lại tạo nên những bất ngờ hay ho!";
      }

      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
